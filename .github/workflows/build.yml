name: Build Prune for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Locate the Makefile by content rather than assuming its path -- the same lesson
      # learned with Halogen. ADDOPTION is a variable name unique to Prune's Makefile.
      - name: Locate Prune Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(grep -rl "ADDOPTION" --include="Makefile" . | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'ADDOPTION' was found."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "makefile_dir=$MAKEFILE_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Locate NDK aarch64 toolchain
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep "aarch64-linux-android24-clang"
          "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" --version

      # ADDOPTION is the Makefile's own hook for extra compiler flags -- used here to define
      # __ARM_NEON__ (the code's chosen macro name, which doesn't match what AArch64 clang
      # actually predefines: __ARM_NEON), and to add -fPIE for the static-pie link below.
      # LDFLAGS gets combined with the Makefile's own -lpthread via its `override ... +=`,
      # not replaced, so -static-pie doesn't need -lpthread appended manually.
      - name: Build Prune (arm64, armv8-a)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            CC="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            ADDOPTION="-D__ARM_NEON__=1 -fPIE" \
            LDFLAGS="-static-pie" \
            EXE=prune-android \
            -j"$(nproc)"

      # DroidFish executes the engine directly with no way to set LD_LIBRARY_PATH, and
      # Android refuses to exec a non-PIE binary since API 21 -- static-pie above should
      # produce a self-contained, PIE-compatible executable. Confirm both properties here.
      - name: Confirm binary is PIE and has no shared library dependencies
        run: |
          BIN="${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android"
          find "${{ steps.locate-makefile.outputs.makefile_dir }}" -maxdepth 1 -iname "prune*" -type f
          file "$BIN"
          echo "--- ELF header type ---"
          readelf -h "$BIN" | grep -i type
          echo "--- Dynamic section (should show no NEEDED entries) ---"
          readelf -d "$BIN" || echo "readelf reports no dynamic section -- fully static, good"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Prune Android build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
