name: Build Prune Android Pre-Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Prune UCI for Android ARM64
        working-directory: ./core
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Build permute natively on host
          make permute CXX=g++ ARCH=native OPT="-O3"

          # 2. Download and generate model.bin
          make model.bin CXX=g++ ARCH=native OPT="-O3" || true
          if [ -f "pulsar.bin" ] && [ ! -f "model.bin" ]; then
            ./permute pulsar.bin model.bin
          fi

          # 3. Clean compile all source files directly with NDK clang++
          echo "Compiling sources for Android ARM64..."
          OBJECTS=""
          for src in *.cpp; do
            if [ "$src" = "permute.cpp" ]; then
              continue
            fi
            obj="${src%.cpp}.o"
            echo "Compiling $src -> $obj"
            "$NDK_CXX" -std=gnu++17 -O3 -march=armv8-a -fPIE -D__ARM_NEON__ \
              -Wno-unused-command-line-argument -c -o "$obj" "$src" || true
            if [ -f "$obj" ]; then
              OBJECTS="$OBJECTS $obj"
            fi
          done

          # 4. Link everything into the final binary
          echo "Linking final executable..."
          "$NDK_CXX" -pie -static-libstdc++ -lpthread $OBJECTS -o prune

          VERSION=$(git rev-parse --short HEAD)
          mkdir -p ../artifacts
          if [ -f "prune" ]; then
            cp "prune" ../artifacts/Prune-${VERSION}-android-arm64
          else
            echo "ERROR: Prune executable not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prune-android
          path: core/../artifacts/*

  publish-prerelease:
    needs:
      - build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true
          gh release create pre-release \
            --title "Prune Android Pre-Release" \
            --prerelease \
            release-assets/prune-android/*

      - name: Clean up Android artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: prune-android
