name: Build Prune for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate Prune Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(grep -rl "ADDOPTION" --include="Makefile" . | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'ADDOPTION' was found."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "makefile_dir=$MAKEFILE_DIR" >> "$GITHUB_OUTPUT"

      - name: Build permute and generate model.bin (host-native)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make model.bin
          ls -la model.bin

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Locate NDK aarch64 toolchain
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep "aarch64-linux-android24-clang"
          "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" --version

      - name: Create pthread stub library
        id: pthread-stub
        run: |
          STUB_DIR="$RUNNER_TEMP/android-stub-libs"
          mkdir -p "$STUB_DIR"
          "${{ steps.find-clang.outputs.toolchain_bin }}/llvm-ar" rcs "$STUB_DIR/libpthread.a"
          echo "stub_dir=$STUB_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$STUB_DIR"

      - name: Build Prune (arm64, armv8-a)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make all \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            CC="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            ADDOPTION="-D__ARM_NEON__=1 -fPIE" \
            LDFLAGS="-static-pie -L${{ steps.pthread-stub.outputs.stub_dir }}" \
            EXE=prune-android \
            -j"$(nproc)"

      - name: Extract libc++_shared.so from NDK
        run: |
          LIBCXX_PATH=$(find "${{ steps.setup-ndk.outputs.ndk-path }}" -name "libc++_shared.so" | grep "aarch64" | head -n1)
          if [ -z "$LIBCXX_PATH" ]; then
            echo "ERROR: libc++_shared.so not found in NDK"
            exit 1
          fi
          echo "Found libc++_shared.so at: $LIBCXX_PATH"
          cp "$LIBCXX_PATH" "${{ steps.locate-makefile.outputs.makefile_dir }}/"

      - name: Confirm outputs
        run: |
          BIN="${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android"
          SO="${{ steps.locate-makefile.outputs.makefile_dir }}/libc++_shared.so"
          file "$BIN" "$SO"
          readelf -h "$BIN" | grep -i type

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: |
            ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
            ${{ steps.locate-makefile.outputs.makefile_dir }}/libc++_shared.so
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Prune Android build ${{ github.run_number }}
          prerelease: true
          files: |
            ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
            ${{ steps.locate-makefile.outputs.makefile_dir }}/libc++_shared.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
