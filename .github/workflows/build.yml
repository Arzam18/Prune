name: Build Prune Android Pre-Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Prune UCI for Android ARM64
        working-directory: ./core
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Build permute natively on host
          make permute CXX=g++ ARCH=native OPT="-O3"

          # 2. Download and generate model.bin
          make model.bin CXX=g++ ARCH=native OPT="-O3" || true
          if [ -f "pulsar.bin" ] && [ ! -f "model.bin" ]; then
            ./permute pulsar.bin model.bin
          fi

          # 3. Force generation of embeder.cpp and patch alignments
          make embeder.cpp CXX="$NDK_CXX" ARCH=armv8-a ADDOPTION="-fPIE -D__ARM_NEON__" || true

          if [ -f "embeder.cpp" ]; then
            sed -i 's/\.align 64/\.align 6/g' embeder.cpp
            sed -i 's/\.align 32/\.align 5/g' embeder.cpp
            sed -i 's/\.align 16/\.align 4/g' embeder.cpp
          else
            echo "ERROR: embeder.cpp missing!"
            exit 1
          fi

          # 4. Compile embeder.o directly
          "$NDK_CXX" -Werror -Wshadow -Wall -Wextra -MMD -std=gnu++17 -I../Fathom/src \
            -fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument \
            -O3 -march=armv8-a \
            -c -o embeder.o embeder.cpp

          # 5. Instead of fighting the Makefile rules, we directly invoke the final linker command 
          # using the NDK C++ compiler, bypassing 'make prune' entirely to prevent rule re-evaluations.
          
          echo "Compiling remaining source files manually..."
          SOURCES=$(ls *.cpp | grep -v "embeder.cpp" || true)
          OBJECTS=""
          
          for src in $SOURCES; do
            obj="${src%.cpp}.o"
            echo "Compiling $src -> $obj"
            "$NDK_CXX" -Werror -Wshadow -Wall -Wextra -MMD -std=gnu++17 -I../Fathom/src \
              -fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument \
              -O3 -flto -march=armv8-a \
              -c -o "$obj" "$src"
            OBJECTS="$OBJECTS $obj"
          done

          echo "Linking final executable..."
          "$NDK_CXX" -O3 -flto -march=armv8-a \
            -fPIE -pie -static-libstdc++ -lpthread \
            $OBJECTS embeder.o -o prune

          VERSION=$(git rev-parse --short HEAD)
          mkdir -p ../artifacts
          
          if [ -f "prune" ]; then
            cp "prune" ../artifacts/Prune-${VERSION}-android-arm64
          else
            echo "ERROR: Prune executable not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prune-android
          path: core/../artifacts/*

  publish-prerelease:
    needs:
      - build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true
          gh release create pre-release \
            --title "Prune Android Pre-Release" \
            --prerelease \
            release-assets/prune-android/*

      - name: Clean up Android artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: prune-android
