name: Build Prune for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract engine version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building Prune version: ${VERSION}"

      - name: Locate Prune Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(grep -rl "ADDOPTION" --include="Makefile" . | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'ADDOPTION' was found."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "makefile_dir=$MAKEFILE_DIR" >> "$GITHUB_OUTPUT"

      - name: Build permute and generate model.bin (host-native)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make model.bin
          ls -la model.bin

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Locate NDK aarch64 toolchain
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep "aarch64-linux-android24-clang"
          "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" --version

      - name: Create pthread stub library
        id: pthread-stub
        run: |
          STUB_DIR="$RUNNER_TEMP/android-stub-libs"
          mkdir -p "$STUB_DIR"
          "${{ steps.find-clang.outputs.toolchain_bin }}/llvm-ar" rcs "$STUB_DIR/libpthread.a"
          echo "stub_dir=$STUB_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$STUB_DIR"

      - name: Build Prune (ARM64 v8-A)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make all \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            CC="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            ADDOPTION="-D__ARM_NEON__=1 -fPIE" \
            LDFLAGS="-static-pie -static-libstdc++ -L${{ steps.pthread-stub.outputs.stub_dir }}" \
            EXE=prune-${{ env.VERSION }}-android-arm64-v8a \
            -j"$(nproc)"

      - name: Build Prune (ARM64 DotProd - Cortex A76+)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          rm -f *.o src/*.o obj/*.o
          make all \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            CC="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang" \
            ARCH=armv8.2-a+dotprod \
            ADDOPTION="-D__ARM_NEON__=1 -march=armv8.2-a+dotprod -fPIE" \
            LDFLAGS="-static-pie -static-libstdc++ -L${{ steps.pthread-stub.outputs.stub_dir }}" \
            EXE=prune-${{ env.VERSION }}-android-arm64-dotprod \
            -j"$(nproc)"

      - name: Confirm binaries are PIE and have no shared library dependencies
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          ls -lh prune-${{ env.VERSION }}-android-*
          file prune-${{ env.VERSION }}-android-*
          readelf -d prune-${{ env.VERSION }}-android-arm64-v8a || echo "No dynamic section"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prune-${{ env.VERSION }}-android-binaries
          path: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-${{ env.VERSION }}-android-*
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}-android
          name: Prune ${{ env.VERSION }} (Android)
          prerelease: true
          files: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-${{ env.VERSION }}-android-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
