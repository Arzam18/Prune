name: Build Prune Android Pre-Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Prune UCI for Android ARM64
        working-directory: ./core
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Build permute natively on host
          make permute CXX=g++ ARCH=native OPT="-O3"

          # 2. Download and generate model.bin
          curl -L -o pulsar.bin https://github.com/dseaman/Prune/releases/download/net/pulsar.bin
          if [ -f "pulsar.bin" ]; then
            ./permute pulsar.bin model.bin
          else
            echo "ERROR: pulsar.bin download failed!"
            exit 1
          fi

          # 3. Force generation of embeder.cpp via the NDK compiler target
          make embeder.cpp \
            CXX="$NDK_CXX" \
            CC="$NDK_CC" \
            ARCH=armv8-a \
            CPUSET=unknow \
            OPT="-O3" \
            ADDOPTION="-fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument" || true

          # If embeder.cpp wasn't generated as a standalone file, force it via embeder.o compilation
          if [ ! -f "embeder.cpp" ]; then
            make embeder.o \
              CXX="$NDK_CXX" \
              CC="$NDK_CC" \
              ARCH=armv8-a \
              CPUSET=unknow \
              OPT="-O3" \
              ADDOPTION="-fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument" || true
          fi

          # 4. Patch .align 64 to .align 6 in embeder.cpp for ARM64 GNU assembler compatibility
          if [ -f "embeder.cpp" ]; then
            echo "Patching embeder.cpp assembly alignments for ARM64..."
            sed -i 's/\.align 64/\.align 6/g' embeder.cpp
          else
            echo "ERROR: embeder.cpp was not generated!"
            exit 1
          fi

          # 5. Build the actual Android ARM64 engine using the NDK toolchain (DO NOT run make clean!)
          make prune \
            CXX="$NDK_CXX" \
            CC="$NDK_CC" \
            ARCH=armv8-a \
            CPUSET=unknow \
            OPT="-O3 -flto" \
            ADDOPTION="-fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument" \
            LDFLAGS="-fPIE -pie -static-libstdc++ -lpthread"

          VERSION=$(git rev-parse --short HEAD)
          mkdir -p ../artifacts
          
          PRUNE_BIN=$(find . -maxdepth 1 ! -name "*.*" -type f -executable | head -n 1)
          if [ -f "$PRUNE_BIN" ]; then
            cp "$PRUNE_BIN" ../artifacts/Prune-${VERSION}-android-arm64
          else
            echo "ERROR: Prune executable not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prune-android
          path: core/../artifacts/*

  publish-prerelease:
    needs:
      - build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true
          gh release create pre-release \
            --title "Prune Android Pre-Release" \
            --prerelease \
            release-assets/prune-android/*

      - name: Clean up Android artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: prune-android
