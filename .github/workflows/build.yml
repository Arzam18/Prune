name: Build Prune Android Pre-Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Prune UCI for Android ARM64
        working-directory: ./core
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Build permute natively on host
          make permute CXX=g++ ARCH=native OPT="-O3"

          # 2. Download and generate model.bin
          make model.bin CXX=g++ ARCH=native OPT="-O3" || true
          if [ -f "pulsar.bin" ] && [ ! -f "model.bin" ]; then
            ./permute pulsar.bin model.bin
          fi

          # 3. Handle embeder.cpp completely via standard file replacement.
          # If the Makefile generates embeder.cpp via a script or rule, we can supply a tiny python script
          # or just rewrite the Makefile rule so it generates the code with correct alignment right away.
          if grep -q "embeder.cpp" Makefile; then
            # Patch the Makefile rule that generates embeder.cpp to substitute .align 64 with .align 6 automatically
            sed -i '/embeder.cpp/ {
              N
              s/\.align 64/\.align 6/g
            }' Makefile || true
          fi

          # Alternatively, let's just make a permanent python post-processor for embeder.cpp 
          # inside the Makefile or run it immediately after generation.
          make embeder.cpp CXX="$NDK_CXX" ARCH=armv8-a ADDOPTION="-fPIE -D__ARM_NEON__" || true

          if [ -f "embeder.cpp" ]; then
            python3 -c '
            with open("embeder.cpp", "r") as f:
                content = f.read()
            content = content.replace(".align 64", ".align 6")
            content = content.replace(".align 32", ".align 5")
            content = content.replace(".align 16", ".align 4")
            with open("embeder.cpp", "w") as f:
                f.write(content)
            '
          fi

          # To prevent the Makefile from attempting to recreate embeder.cpp during 'make prune',
          # we touch the file with a future timestamp or remove its prerequisite rule from Makefile.
          sed -i '/^embeder\.cpp:/,$ { /^\t/! { /^[^:]*:/d } }' Makefile || true

          # 4. Run standard make prune cleanly
          make prune \
            CXX="$NDK_CXX" \
            CC="$NDK_CC" \
            ARCH=armv8-a \
            CPUSET=unknow \
            OPT="-O3 -flto" \
            ADDOPTION="-fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument" \
            LDFLAGS="-fPIE -pie -static-libstdc++ -lpthread"

          VERSION=$(git rev-parse --short HEAD)
          mkdir -p ../artifacts
          
          PRUNE_BIN=$(find . -maxdepth 1 ! -name "*.*" -type f -executable | head -n 1)
          if [ -f "$PRUNE_BIN" ]; then
            cp "$PRUNE_BIN" ../artifacts/Prune-${VERSION}-android-arm64
          else
            echo "ERROR: Prune executable not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prune-android
          path: core/../artifacts/*

  publish-prerelease:
    needs:
      - build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true
          gh release create pre-release \
            --title "Prune Android Pre-Release" \
            --prerelease \
            release-assets/prune-android/*

      - name: Clean up Android artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: prune-android
