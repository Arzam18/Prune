name: Build Prune Android Pre-Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Prune UCI for Android ARM64
        working-directory: ./core
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          NDK_CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"

          # 1. Build permute natively on host
          make permute CXX=g++ ARCH=native OPT="-O3"

          # 2. Download and generate model.bin
          make model.bin CXX=g++ ARCH=native OPT="-O3" || true
          if [ -f "pulsar.bin" ] && [ ! -f "model.bin" ]; then
            ./permute pulsar.bin model.bin
          fi

          # 3. Create a custom Python/Perl/Sed script or inline generator to completely bypass 
          # the buggy assembly alignment in embeder.cpp by overriding how embeder.o is built.
          # Instead of relying on Makefile rules, we directly compile embeder.cpp with sed pre-applied.
          
          # Force generation of embeder.cpp
          make embeder.cpp CXX="$NDK_CXX" ARCH=armv8-a ADDOPTION="-fPIE -D__ARM_NEON__" || true

          if [ -f "embeder.cpp" ]; then
            sed -i 's/\.align 64/\.align 6/g' embeder.cpp
            sed -i 's/\.align 32/\.align 5/g' embeder.cpp
            sed -i 's/\.align 16/\.align 4/g' embeder.cpp
          fi

          # Compile embeder.o manually using the NDK toolchain with the patch securely in place
          "$NDK_CXX" -Werror -Wshadow -Wall -Wextra -MMD -std=gnu++17 -I../Fathom/src \
            -fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument \
            -O3 -march=armv8-a \
            -c -o embeder.o embeder.cpp

          # 4. Strip embeder.cpp and embeder.o references from Makefile so it never tries to touch them again
          if [ -f "Makefile" ]; then
            sed -i '/embeder/d' Makefile || true
          fi

          # 5. Build the rest of the project and link everything including our pre-compiled embeder.o
          make prune \
            CXX="$NDK_CXX" \
            CC="$NDK_CC" \
            ARCH=armv8-a \
            CPUSET=unknow \
            OPT="-O3 -flto" \
            ADDOPTION="-fPIE -D__ARM_NEON__ -Wno-unused-command-line-argument" \
            LDFLAGS="-fPIE -pie -static-libstdc++ -lpthread embeder.o"

          VERSION=$(git rev-parse --short HEAD)
          mkdir -p ../artifacts
          
          PRUNE_BIN=$(find . -maxdepth 1 ! -name "*.*" -type f -executable | head -n 1)
          if [ -f "$PRUNE_BIN" ]; then
            cp "$PRUNE_BIN" ../artifacts/Prune-${VERSION}-android-arm64
          else
            echo "ERROR: Prune executable not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: prune-android
          path: core/../artifacts/*

  publish-prerelease:
    needs:
      - build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pre-release --yes --cleanup-tag || true
          gh release create pre-release \
            --title "Prune Android Pre-Release" \
            --prerelease \
            release-assets/prune-android/*

      - name: Clean up Android artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: prune-android
