name: Build Prune for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Locate the Makefile by content rather than assuming its path -- the same lesson
      # learned with Halogen. ADDOPTION is a variable name unique to Prune's Makefile.
      - name: Locate Prune Makefile
        id: locate-makefile
        run: |
          echo "All Makefiles found in repo:"
          find . -iname "Makefile"
          echo "---"
          MAKEFILE_PATH=$(grep -rl "ADDOPTION" --include="Makefile" . | head -n1)
          if [ -z "$MAKEFILE_PATH" ]; then
            echo "ERROR: no Makefile containing 'ADDOPTION' was found."
            exit 1
          fi
          echo "Using Makefile: $MAKEFILE_PATH"
          MAKEFILE_DIR=$(dirname "$MAKEFILE_PATH")
          echo "makefile_dir=$MAKEFILE_DIR" >> "$GITHUB_OUTPUT"

      # `permute` is a build-time HOST TOOL: the Makefile compiles it and then executes it
      # (`./permute ... model.bin`) to pre-process the network weights before the engine
      # itself is built -- the same "tool must run on the build machine, not the target"
      # issue solved for Halogen via HOSTCXX. Here there is no separate host-compiler
      # variable, and permute's own recipe doesn't even pass ADDOPTION/CPPFLAGS, so it must
      # be built with the host's native compiler (its x86_64 SIMD branch is exactly right
      # for that) BEFORE the NDK compiler is introduced at all -- never cross-compiled.
      - name: Build permute and generate model.bin (host-native)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make model.bin
          ls -la model.bin

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Locate NDK aarch64 toolchain
        id: find-clang
        run: |
          TOOLCHAIN_BIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "toolchain_bin=$TOOLCHAIN_BIN" >> "$GITHUB_OUTPUT"
          ls "$TOOLCHAIN_BIN" | grep "aarch64-linux-android24-clang"
          "$TOOLCHAIN_BIN/aarch64-linux-android24-clang++" --version

      # model.bin already exists and is newer than its prerequisites (permute, the
      # downloaded net) from the host-native step above, so this `all` build does NOT
      # re-trigger permute's recipe -- it only compiles/links the engine's own sources,
      # which DO honor ADDOPTION/CPPFLAGS, so __ARM_NEON__ reaches every one of them.
      # Bionic (Android's libc) has never had a separate pthread library -- pthread
      # functions have always lived directly in libc.so. Older NDKs shipped an empty
      # stub libpthread.so/.a purely so legacy build systems that unconditionally pass
      # -lpthread wouldn't break; NDK r23+ removed those stubs. This Makefile bakes
      # -lpthread into LDFLAGS unconditionally (combined via `override LDFLAGS +=`, so
      # it can't be removed from the command line), so an empty stub archive is created
      # here and its directory added to the link search path -- -lpthread then resolves
      # to nothing, which is correct, since the real symbols are already in libc.
      - name: Create pthread stub library
        id: pthread-stub
        run: |
          STUB_DIR="$RUNNER_TEMP/android-stub-libs"
          mkdir -p "$STUB_DIR"
          "${{ steps.find-clang.outputs.toolchain_bin }}/llvm-ar" rcs "$STUB_DIR/libpthread.a"
          echo "stub_dir=$STUB_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$STUB_DIR"

      - name: Build Prune (arm64, armv8-a)
        run: |
          cd "${{ steps.locate-makefile.outputs.makefile_dir }}"
          make all \
            CXX="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang++" \
            CC="${{ steps.find-clang.outputs.toolchain_bin }}/aarch64-linux-android24-clang" \
            ARCH=armv8-a \
            ADDOPTION="-D__ARM_NEON__=1 -fPIE" \
            LDFLAGS="-static-pie -L${{ steps.pthread-stub.outputs.stub_dir }}" \
            EXE=prune-android \
            -j"$(nproc)"

      # DroidFish executes the engine directly with no way to set LD_LIBRARY_PATH, and
      # Android refuses to exec a non-PIE binary since API 21 -- static-pie above should
      # produce a self-contained, PIE-compatible executable. Confirm both properties here.
      - name: Confirm binary is PIE and has no shared library dependencies
        run: |
          BIN="${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android"
          find "${{ steps.locate-makefile.outputs.makefile_dir }}" -maxdepth 1 -iname "prune*" -type f
          file "$BIN"
          echo "--- ELF header type ---"
          readelf -h "$BIN" | grep -i type
          echo "--- Dynamic section (should show no NEEDED entries) ---"
          readelf -d "$BIN" || echo "readelf reports no dynamic section -- fully static, good"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
          if-no-files-found: error

      - name: Create prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Prune Android build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.locate-makefile.outputs.makefile_dir }}/prune-android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
