name: Prune Android A-B ELF Runtime Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang curl file binutils python3

      - name: Install Android NDK 27.2.12479018
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-24" "ndk;27.2.12479018"
          NDK="$SDK_ROOT/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      - name: Build standalone UCI probe
        shell: bash
        run: |
          set -euxo pipefail
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p artifact
          "$CXX" \
            -std=gnu++17 \
            -O2 \
            -march=armv8.2-a+dotprod \
            -fuse-ld=lld \
            -static-libstdc++ \
            -Wl,-Bstatic \
            -lc++ \
            -lc++abi \
            -Wl,-Bdynamic \
            -pthread \
            -Wl,-z,max-page-size=16384 \
            core/uci_probe.cpp \
            -o artifact/prune-uci-probe
          chmod +x artifact/prune-uci-probe

          # Prune's Makefile automatically compiles every *.cpp in core/.
          # Remove the standalone probe source before invoking that Makefile,
          # otherwise both files define main().
          rm -f core/uci_probe.cpp

      - name: Build real Prune with Stormphrax-style runtime flags
        working-directory: core
        shell: bash
        run: |
          set -euxo pipefail
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          clang++ -std=gnu++17 -O3 -flto -funroll-loops -D_CRT_SECURE_NO_WARNINGS -o permute permute.cpp

          RELEASE_TAG="$(head -n 1 nn-name.txt | tr -d '\r\n')"
          NETNAME="$(tail -n 1 nn-name.txt | tr -d '\r\n')"
          curl --fail --location --retry 3 --retry-delay 2 \
            -o "${NETNAME}.bin" \
            "https://github.com/tgirolami09/Prune-nets/releases/download/${RELEASE_TAG}/${NETNAME}.bin"
          ./permute "${NETNAME}.bin" model.bin

          make clean || true
          touch ./permute

          make -j2 prune \
            CXX="$CXX" \
            CC="$CC" \
            ANDROID=true \
            ARCH="armv8.2-a+dotprod" \
            CPUSET="unknow" \
            ADDOPTION="-D__ARM_NEON__ -flax-vector-conversions" \
            OPT="-O3 -flto -funroll-loops" \
            LDFLAGS="-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld -Wl,-z,max-page-size=16384" \
            EXE="prune-android-arm64-ab"

          cp prune-android-arm64-ab ../artifact/
          chmod +x ../artifact/prune-android-arm64-ab

      - name: Inspect both ELF files
        shell: bash
        run: |
          set -euxo pipefail
          for f in artifact/prune-uci-probe artifact/prune-android-arm64-ab; do
            echo "===== $f ====="
            file "$f"
            readelf -h "$f"
            echo "--- dynamic dependencies ---"
            readelf -d "$f" || true
            echo "--- program headers ---"
            readelf -l "$f"
            echo "--- needed C++ runtime entries ---"
            readelf -d "$f" | grep -E 'NEEDED|RPATH|RUNPATH' || true
          done

      - name: Upload A-B binaries and ELF report
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-ab
          path: |
            artifact/prune-uci-probe
            artifact/prune-android-arm64-ab
          if-no-files-found: error
          compression-level: 0
