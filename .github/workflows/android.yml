name: Build Prune for Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "ndk;27.2.12479018"

      - name: Set Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android24-clang++"
          test -x "$LLVM/readelf"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "$LLVM" >> "$GITHUB_PATH"

      - name: Remove diagnostic files
        shell: bash
        run: |
          set -euo pipefail

          rm -f core/uci_probe.cpp
          rm -f core/uci_probe.o
          rm -f core/uci_probe.d

          rm -f core/engine.o
          rm -f core/engine.d

      - name: Restore REAL Prune engine.cpp
