          grep -n 'BestMoveFinder bestMoveFinder' engine.cpp | head -1
          grep -n 'int main' engine.cpp | tail -1

      - name: Download and prepare NNUE
        shell: bash
        run: |
          set -euo pipefail

          cd core

          NETNAME="$(tail -1 nn-name.txt)"
          RELEASE="$(head -1 nn-name.txt)"
          URL="https://github.com/tgirolami09/Prune-nets/releases/download/$RELEASE/$NETNAME.bin"

          echo "Downloading $URL"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$NETNAME.bin" \
            "$URL"

          clang++ -std=gnu++17 -O3 -flto -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -o permute permute.cpp

          ./permute "$NETNAME.bin" model.bin

          test -s model.bin

          echo "model.bin: $(stat -c%s model.bin) bytes"

      - name: Build REAL Prune Android ARM64 NEON
        shell: bash
        run: |
          set -euo pipefail

          cd core

          make clean || true
          rm -f prune

          "$LLVM/aarch64-linux-android24-clang++" --version

          make -f Makefile prune \
            CXX="$LLVM/aarch64-linux-android24-clang++" \
            CC="$LLVM/aarch64-linux-android24-clang" \
            MAIN=engine.cpp \
            ARCH=armv8.2-a+dotprod \
            ANDROID=true \
            OPT='-O3 -flto -funroll-loops -fuse-ld=lld' \
            LDFLAGS='-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld -Wl,-z,max-page-size=16384'

          test -x prune

          cp prune ../prune-android-arm64-neon

      - name: Inspect ELF
        shell: bash
        run: |
          set -euo pipefail

          file prune-android-arm64-neon

          "$LLVM/readelf" -h prune-android-arm64-neon
          "$LLVM/readelf" -l prune-android-arm64-neon
          "$LLVM/readelf" -d prune-android-arm64-neon || true

      - name: UCI smoke test
        shell: bash
        run: |
          set -euo pipefail

          printf 'uci\nisready\nposition startpos\ngo depth 2\nquit\n' \
            | ./prune-android-arm64-neon || true

      - name: Upload real Prune binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: prune-android-arm64-neon
          if-no-files-found: error
