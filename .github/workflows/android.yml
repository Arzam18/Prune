name: Build Prune for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "core/**"
      - "Fathom/src/**"
      - "nn-name.txt"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install the NDK directly. This avoids sdkmanager's package/license
      # failure in android-actions/setup-android.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Build ARM64 Android engine
        working-directory: core
        shell: bash
        run: |
          set -euxo pipefail
          : "${ANDROID_NDK_HOME:?Android NDK setup did not define ANDROID_NDK_HOME}"
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          make clean || true
          make -j2 ANDROID=true CC="$CC" CXX="$CXX" ARCH=armv8-a+simd OPT="-O3 -flto -funroll-loops"
          BIN="$(find . -maxdepth 1 -type f -name 'prune-*' ! -name '*.d' -print -quit)"
          if [[ -z "$BIN" ]]; then
            echo "Build completed without producing a prune-* executable."
            ls -la
            exit 1
          fi
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          mkdir -p ../dist
          cp "$BIN" ../dist/prune-android-arm64

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: dist/prune-android-arm64
