name: Build Prune for Android ARM64 (NEON + Dotprod)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "core/**"
      - "Fathom/src/**"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and verify Android ARM64 variants
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [[ -z "$NDK_DIR" || ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
            NDK_DIR=""
            if [[ -d "$SDK_DIR/ndk" ]]; then
              NDK_DIR="$(find "$SDK_DIR/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            fi
          fi

          test -n "$NDK_DIR"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          OBJDUMP="$TOOLCHAIN/llvm-objdump"

          test -x "$CC"
          test -x "$CXX"
          test -x "$OBJDUMP"
          command -v c++ >/dev/null
          command -v readelf >/dev/null
          command -v stat >/dev/null

          echo "NDK: $NDK_DIR"
          "$CXX" --version
          echo "Dotprod target feature check:"
          printf '' | "$CXX" -march=armv8.2-a+dotprod -dM -E -x c++ - | grep '__ARM_FEATURE_DOTPROD'

          # Both Android builds use 128-bit NEON registers, so the network
          # converter must use the 128-bit layout for both variants.
          HOSTCXX="$(command -v c++)"
          HOSTOPT="-O2 -DARCHSIZE=128 -DPRUNE_ANDROID_NEON_LAYOUT=1"

          rm -f permute model.bin
          make clean || true

          build_variant() {
            local arch="$1"
            local output="$2"
            local extra_opt="$3"

            echo "============================================================"
            echo "Building $output with -march=$arch"
            echo "============================================================"

            make -j2 ANDROID=true \
              CC="$CC" CXX="$CXX" HOSTCXX="$HOSTCXX" HOSTOPT="$HOSTOPT" \
              ARCH="$arch" EXE="$output" \
              OPT="-O3 -flto -funroll-loops -mtune=cortex-a76 -fPIE $extra_opt" \
              LDFLAGS="-pie"

            mkdir -p ../dist
            cp "$output" "../dist/$output"
          }

          # The converted NNUE and magic table are included by embedded_data.S.
          # Validate their exact sizes in that object file, where the assembler
          # emits the original .size metadata. Do not depend on the final PIE's
          # symbol table, which may be changed by LTO/linker processing.
          verify_embedded_object() {
            local model_size="$1"
            local magics_size="$2"
            local model_line magics_line model_symbol_size magics_symbol_size

            test -s embedded_data.o
            model_line="$(readelf -sW embedded_data.o | awk '$NF == "baseModel" { line=$0 } END { print line }')"
            magics_line="$(readelf -sW embedded_data.o | awk '$NF == "magicsData" { line=$0 } END { print line }')"

            if [[ -z "$model_line" || -z "$magics_line" ]]; then
              echo "ERROR: embedded_data.o is missing baseModel or magicsData symbols"
              readelf -sW embedded_data.o
              return 1
            fi

            model_symbol_size_raw="$(awk '{print $3}' <<< "$model_line")"
            magics_symbol_size_raw="$(awk '{print $3}' <<< "$magics_line")"

            # GNU readelf may print symbol sizes as decimal, while LLVM
            # readelf prints them as hexadecimal (for example, 0x3526900).
            # Normalize both formats before comparing against stat's decimal
            # byte count. The prior check rejected valid hexadecimal sizes.
            normalize_symbol_size() {
              local raw="${1,,}"
              if [[ "$raw" =~ ^0x[0-9a-f]+$ ]]; then
                printf '%d' "$((raw))"
              elif [[ "$raw" =~ ^[0-9]+$ ]]; then
                printf '%d' "$((10#$raw))"
              else
                echo "ERROR: unrecognized ELF symbol size: $1" >&2
                return 1
              fi
            }

            model_symbol_size="$(normalize_symbol_size "$model_symbol_size_raw")"
            magics_symbol_size="$(normalize_symbol_size "$magics_symbol_size_raw")"
            echo "NNUE object symbol size: $model_symbol_size_raw bytes ($model_symbol_size normalized; expected $model_size)"
            echo "Magic object symbol size: $magics_symbol_size_raw bytes ($magics_symbol_size normalized; expected $magics_size)"

            [[ "$model_symbol_size" -eq "$model_size" ]]
            [[ "$magics_symbol_size" -eq "$magics_size" ]]
          }

          verify_elf() {
            local bin="$1"
            local header needed

            file "$bin"
            header="$(readelf -hW "$bin")"
            printf '%s\n' "$header" | grep 'Class:.*ELF64'
            printf '%s\n' "$header" | grep 'Machine:.*AArch64'

            needed="$(readelf -d "$bin" | grep 'NEEDED' || true)"
            echo "Dynamic dependencies (Android system libraries are expected):"
            printf '%s\n' "$needed"
            if [[ "$needed" == *"libc++_shared.so"* ]]; then
              echo "ERROR: unexpected libc++_shared.so runtime dependency"
              return 1
            fi
          }

          # Convert once. Both targets are 128-bit NEON and therefore share
          # the same correctly permuted model layout.
          rm -f model.bin
          make model.bin \
            ANDROID=true CC="$CC" CXX="$CXX" HOSTCXX="$HOSTCXX" HOSTOPT="$HOSTOPT" \
            ARCH=armv8-a+simd
          MODEL_SIZE="$(stat -c '%s' model.bin)"
          MAGICS_SIZE="$(stat -c '%s' magics.out)"
          echo "Converted NNUE: $MODEL_SIZE bytes"
          echo "Magic data: $MAGICS_SIZE bytes"

          # Build the baseline NEON executable first.
          build_variant armv8-a+simd prune-android-arm64-neon ""
          verify_embedded_object "$MODEL_SIZE" "$MAGICS_SIZE"
          verify_elf ../dist/prune-android-arm64-neon

          # Rebuild every target object with Dotprod enabled. The converter
          # remains 128-bit because SDOT does not change the vector width.
          make clean
          build_variant armv8.2-a+dotprod prune-android-arm64-dotprod ""
          verify_embedded_object "$MODEL_SIZE" "$MAGICS_SIZE"
          verify_elf ../dist/prune-android-arm64-dotprod

          echo "Checking that the Dotprod executable contains SDOT..."
          "$OBJDUMP" -d ../dist/prune-android-arm64-dotprod |
            awk '/[[:space:]]sdot[[:space:]]/ { found=1 } END { exit !found }'

          echo "Build outputs:"
          ls -lh ../dist

      - name: Upload standalone Android ARM64 engines
        uses: actions/upload-artifact@v4
        with:
          name: Prune-Android-ARM64-NEON-Dotprod
          path: dist/*
          if-no-files-found: error
