name: Build Prune for Android ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "core/**"
      - "Fathom/src/**"
      - "nn-name.txt"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build ARM64 Android engine
        working-directory: core
        run: |
          set -euxo pipefail
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            NDK_DIR="$(find /usr/local/lib/android/sdk/ndk "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$NDK_DIR"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          make clean || true
          make -j2 ANDROID=true CC="$CC" CXX="$CXX" ARCH=armv8-a+simd OPT="-O3 -flto -funroll-loops"
          BIN="$(find . -maxdepth 1 -type f -name 'prune-*' ! -name '*.d' | head -n 1)"
          test -n "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          mkdir -p ../dist
          cp "$BIN" ../dist/prune-android-arm64
          echo "Checking dynamic dependencies:"
          readelf -d ../dist/prune-android-arm64 | grep NEEDED || true
          if readelf -d ../dist/prune-android-arm64 | grep -q 'libc++_shared.so'; then
            echo "ERROR: libc++_shared.so is still a runtime dependency; static linking failed."
            exit 1
          fi
          ls -lh ../dist
      - name: Upload standalone Android engine
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64
          path: dist/prune-android-arm64
