name: Build Prune for Android ARM64 (NEON + Dotprod)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "core/**"
      - "Fathom/src/**"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build and verify Android ARM64 variants
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_DIR="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [[ -z "$NDK_DIR" || ! -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]]; then
            NDK_DIR=""
            if [[ -d "$SDK_DIR/ndk" ]]; then
              NDK_DIR="$(find "$SDK_DIR/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            fi
          fi

          test -n "$NDK_DIR"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          OBJDUMP="$TOOLCHAIN/llvm-objdump"

          test -x "$CC"
          test -x "$CXX"
          test -x "$OBJDUMP"
          command -v c++ >/dev/null
          command -v readelf >/dev/null
          command -v stat >/dev/null

          echo "NDK: $NDK_DIR"
          "$CXX" --version
          echo "Target feature check:"
          printf '' | "$CXX" -march=armv8.2-a+dotprod -dM -E -x c++ - | grep '__ARM_FEATURE_DOTPROD'

          # The engine and NEON backend use 128-bit vectors. Force the host-side
          # converter to generate that exact layout rather than depending on the
          # GitHub runner's default x86 SIMD flags.
          HOSTCXX="$(command -v c++)"
          HOSTOPT="-O2 -DARCHSIZE=128 -DPRUNE_ANDROID_NEON_LAYOUT=1"

          # Rebuild the converter/model from the source network with the explicit
          # 128-bit layout. This also prevents a stale model.bin from being reused.
          rm -f permute model.bin
          make clean || true
          make -j2 ANDROID=true \
            CC="$CC" CXX="$CXX" HOSTCXX="$HOSTCXX" HOSTOPT="$HOSTOPT" \
            ARCH=armv8-a+simd EXE=prune-android-arm64-neon \
            OPT="-O3 -flto -funroll-loops -mtune=cortex-a76 -fPIE" \
            LDFLAGS="-pie"

          mkdir -p ../dist
          cp prune-android-arm64-neon ../dist/
          MODEL_SIZE="$(stat -c '%s' model.bin)"
          MAGICS_SIZE="$(stat -c '%s' magics.out)"

          verify_elf() {
            local bin="$1"
            local header needed model_symbol_size magics_symbol_size

            file "$bin"
            header="$(readelf -hW "$bin")"
            printf '%s\n' "$header" | grep 'Class:.*ELF64'
            printf '%s\n' "$header" | grep 'Machine:.*AArch64'

            needed="$(readelf -d "$bin" | grep 'NEEDED' || true)"
            printf '%s\n' "$needed"
            if [[ "$needed" == *"libc++_shared.so"* ]]; then
              echo "ERROR: unexpected libc++_shared.so runtime dependency"
              return 1
            fi

            model_symbol_size="$(readelf -sW "$bin" | awk '$8 == "baseModel" { print $3; exit }')"
            magics_symbol_size="$(readelf -sW "$bin" | awk '$8 == "magicsData" { print $3; exit }')"
            [[ "$model_symbol_size" =~ ^[0-9]+$ ]]
            [[ "$magics_symbol_size" =~ ^[0-9]+$ ]]
            [[ "$model_symbol_size" -eq "$MODEL_SIZE" ]]
            [[ "$magics_symbol_size" -eq "$MAGICS_SIZE" ]]
            echo "Embedded NNUE: ${model_symbol_size} bytes"
            echo "Embedded magics: ${magics_symbol_size} bytes"
          }

          verify_elf ../dist/prune-android-arm64-neon

          # Recompile every target object with Dotprod enabled. The already
          # converted 128-bit model is also the correct layout for this build.
          make clean
          make -j2 ANDROID=true \
            CC="$CC" CXX="$CXX" HOSTCXX="$HOSTCXX" HOSTOPT="$HOSTOPT" \
            ARCH=armv8.2-a+dotprod EXE=prune-android-arm64-dotprod \
            OPT="-O3 -flto -funroll-loops -mtune=cortex-a76 -fPIE" \
            LDFLAGS="-pie"

          cp prune-android-arm64-dotprod ../dist/
          verify_elf ../dist/prune-android-arm64-dotprod

          echo "Checking that the optimized build actually contains SDOT..."
          "$OBJDUMP" -d ../dist/prune-android-arm64-dotprod |
            awk '/[[:space:]]sdot[[:space:]]/ { found=1 } END { exit !found }'

          echo "Build outputs:"
          ls -lh ../dist

      - name: Upload standalone Android ARM64 engines
        uses: actions/upload-artifact@v4
        with:
          name: Prune-Android-ARM64-NEON-Dotprod
          path: dist/*
          if-no-files-found: error
