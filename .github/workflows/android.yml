name: Build Prune for Android ARM64 NEON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ============================================================
      # ANDROID NDK
      # ============================================================
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "ndk;27.2.12479018"

      # ============================================================
      # ANDROID TOOLCHAIN
      # ============================================================
      - name: Set Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$LLVM/aarch64-linux-android24-clang++"
          test -x "$LLVM/aarch64-linux-android24-clang"
          test -x "$LLVM/readelf"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "LLVM=$LLVM" >> "$GITHUB_ENV"
          echo "$LLVM" >> "$GITHUB_PATH"

      # ============================================================
      # REMOVE DIAGNOSTIC BUILD FILES
      # ============================================================
      - name: Remove diagnostic files
        shell: bash
        run: |
          set -euo pipefail

          rm -f core/uci_probe.cpp
          rm -f core/uci_probe.o
          rm -f core/uci_probe.d

          rm -f core/engine.o
          rm -f core/engine.d

      # ============================================================
      # VERIFY REAL PRUNE SOURCE
      # ============================================================
      - name: Verify REAL Prune source
        shell: bash
        run: |
          set -euo pipefail

          test -f core/engine.cpp
          test -f core/Makefile
          test -f core/permute.cpp
          test -f core/nn-name.txt

          grep -q 'BestMoveFinder' core/engine.cpp
          grep -q 'int main' core/engine.cpp

          if grep -q 'Prune-CET-Diagnostic' core/engine.cpp; then
            echo 'ERROR: diagnostic engine.cpp detected'
            exit 1
          fi

          echo "Using repository Prune engine.cpp:"
          wc -c core/engine.cpp

          echo "BestMoveFinder:"
          grep -n 'BestMoveFinder bestMoveFinder' core/engine.cpp | head -1 || true

          echo "main:"
          grep -n 'int main' core/engine.cpp | tail -1

      # ============================================================
      # DOWNLOAD AND PREPARE NNUE
      # ============================================================
      - name: Download and prepare NNUE
        shell: bash
        run: |
          set -euo pipefail

          cd core

          NETNAME="$(tail -1 nn-name.txt)"
          RELEASE="$(head -1 nn-name.txt)"
          URL="https://github.com/tgirolami09/Prune-nets/releases/download/$RELEASE/$NETNAME.bin"

          echo "Downloading:"
          echo "$URL"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$NETNAME.bin" \
            "$URL"

          clang++ -std=gnu++17 -O3 -flto -funroll-loops \
            -D_CRT_SECURE_NO_WARNINGS \
            -o permute permute.cpp

          ./permute "$NETNAME.bin" model.bin

          test -s model.bin

          echo "model.bin:"
          stat -c '%s bytes' model.bin

      # ============================================================
      # BUILD REAL PRUNE
      # ============================================================
      - name: Build REAL Prune Android ARM64 NEON
        shell: bash
        run: |
          set -euo pipefail

          cd core

          make clean || true

          rm -f prune

          echo "Compiler:"
          "$LLVM/aarch64-linux-android24-clang++" --version

          echo "Building ARM64-v8.2a + dotprod..."

          make -f Makefile prune \
            CXX="$LLVM/aarch64-linux-android24-clang++" \
            CC="$LLVM/aarch64-linux-android24-clang" \
            MAIN=engine.cpp \
            ARCH=armv8.2-a+dotprod \
            ANDROID=true \
            OPT='-O3 -flto -funroll-loops -fuse-ld=lld' \
            LDFLAGS='-static-libstdc++ -Wl,-Bstatic -lc++ -lc++abi -Wl,-Bdynamic -pthread -fuse-ld=lld -Wl,-z,max-page-size=16384'

          test -x prune

          cp prune ../prune-android-arm64-neon

      # ============================================================
      # ELF INSPECTION
      # ============================================================
      - name: Inspect ELF
        shell: bash
        run: |
          set -euo pipefail

          file prune-android-arm64-neon

          "$LLVM/readelf" -h prune-android-arm64-neon
          "$LLVM/readelf" -l prune-android-arm64-neon

          "$LLVM/readelf" -d prune-android-arm64-neon || true

      # ============================================================
      # UCI SMOKE TEST
      # ============================================================
      - name: UCI smoke test
        shell: bash
        run: |
          set -euo pipefail

          printf 'uci\nisready\nposition startpos\ngo depth 2\nquit\n' \
            | ./prune-android-arm64-neon || true

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload real Prune binary
        uses: actions/upload-artifact@v4
        with:
          name: prune-android-arm64-neon
          path: prune-android-arm64-neon
          if-no-files-found: error
